{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h1>Add Employee</h1>

    <form method="POST">
        <div class="form-group">
            <label>First Name</label>
            <input name="first_name" required>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input name="last_name" required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input name="address">
        </div>

        <div class="form-group">
            <label>City</label>
            <input name="city">
        </div>

        <div class="form-group">
            <label>State</label>
            <input name="state">
        </div>

        <div class="form-group">
            <label>Zip Code</label>
            <input name="zipcode">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input name="phone">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input name="email">
        </div>

        <button type="submit" class="btn btn-primary">Add Employee</button>
    </form>
</div>
{% endblock %}
